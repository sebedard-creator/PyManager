<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyManager — Control Center</title>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- CSS -->
    <link rel="stylesheet" href="/static/style.css?v=7">
    
    <!-- Prevent theme flash -->
    <script>
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            document.documentElement.setAttribute('data-theme', savedTheme);
        }
    </script>
</head>
<body x-data="pymanager()">

    <div class="container">
        
        <!-- ─── Header ─── -->
        <header class="header">
            <h1>
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                PyManager
            </h1>
            <div class="header-actions">
                <button class="btn btn-primary" @click="openAddModal()">
                    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M12 5v14m7-7H5"/></svg>
                    Nouveau service
                </button>
                <button class="btn btn-icon" @click="toggleTheme()" title="Basculer le thème">
                    <span x-text="theme === 'dark' ? '☀️' : '🌙'"></span>
                </button>
            </div>
        </header>

        <!-- ─── Services List ─── -->
        <main class="grid">
            <template x-for="script in scripts" :key="script.id">
                <div class="card">
                    <!-- Status Indicator -->
                    <div class="status-dot" :class="script.is_running ? 'active' : ''" :title="script.is_running ? 'En cours' : 'Arrêté'"></div>
                    
                    <!-- Main Info Column -->
                    <div class="card-main">
                        <div class="card-top">
                            <h2 class="card-title" x-text="script.name" :title="script.name"></h2>
                            <span class="badge" x-show="script.auto_start" title="Démarrage automatique">Auto</span>
                            <span class="badge" x-show="script.discovered_port" x-text="'Port: ' + script.discovered_port" style="color: var(--text-main); background: var(--bg-base);"></span>
                            <span class="badge" x-show="script.is_running" x-text="'PID: ' + script.pid" style="color: var(--accent-blue); background: rgba(59, 130, 246, 0.1);"></span>
                            <a :href="script.github_url" target="_blank" rel="noopener" class="badge" x-show="script.github_url" title="Ouvrir sur GitHub" style="color: var(--text-main); background: transparent; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; padding: 2px 6px;">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0 1 12 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.161 22 16.418 22 12c0-5.523-4.477-10-10-10z"/></svg>
                            </a>
                            <a :href="script.web_url" target="_blank" rel="noopener" class="badge" x-show="script.web_url" title="Ouvrir la page Web" style="color: var(--accent-blue); background: transparent; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; padding: 2px 6px;">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/></svg>
                            </a>
                        </div>
                        
                        <div class="card-info">
                            <!-- Path -->
                            <div class="info-item" :title="'Chemin : ' + script.path">
                                <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
                                <span x-text="script.path"></span>
                            </div>
                            <!-- CWD -->
                            <div class="info-item" x-show="script.cwd" :title="'Dossier : ' + script.cwd" x-cloak>
                                <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                                <span x-text="script.cwd"></span>
                            </div>
                            <!-- Args -->
                            <div class="info-item" x-show="script.args" :title="'Arguments : ' + script.args" x-cloak>
                                <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
                                <span x-text="script.args"></span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Actions -->
                    <div class="card-actions">
                        <button class="btn action-start" @click="startScript(script.id)" x-show="!script.is_running" title="Démarrer">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                            Start
                        </button>
                        <button class="btn action-stop" @click="stopScript(script.id)" x-show="script.is_running" x-cloak title="Arrêter">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
                            Stop
                        </button>
                        
                        <!-- Auto Web URL -->
                        <a :href="script.discovered_port ? (window.location.protocol + '//' + window.location.hostname + ':' + script.discovered_port) : script.discovered_url" target="_blank" rel="noopener" class="btn action-web" x-show="script.discovered_url || script.discovered_port" x-cloak title="Ouvrir le WebUI">
                            <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                            LAN
                        </a>
                        
                        <button class="btn btn-icon" @click="openLogModal(script)" title="Voir les logs">
                            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                        </button>
                        <button class="btn btn-icon" @click="openEditModal(script)" :disabled="script.is_running" title="Modifier">
                            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                        </button>
                        <button class="btn btn-icon text-danger" @click="deleteScript(script.id)" :disabled="script.is_running" title="Supprimer">
                            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        </button>
                    </div>
                </div>
            </template>
            
            <!-- Empty State -->
            <div x-show="scripts.length === 0" class="empty-state" x-cloak>
                <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M20 12H4M12 4v16"/>
                </svg>
                <div style="font-size: 14px; font-weight: 500; color: var(--text-main);">Aucun service</div>
                <div style="font-size: 12px; margin-top: 4px;">Cliquez sur « Nouveau service » pour en ajouter un.</div>
            </div>
        </main>
    </div>

    <!-- ─── Add Script Modal ─── -->
    <div class="modal-overlay" x-show="showAddModal" style="display: none;">
        <div class="modal" x-show="showAddModal">
            <div class="modal-header">
                <h2 x-text="isEditing ? 'Modifier le service' : 'Nouveau service'"></h2>
                <button class="btn btn-icon" @click="showAddModal = false" style="border:none;">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M18 6 6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <form @submit.prevent="submitAddScript" id="addScriptForm">
                    <div class="form-group">
                        <label>Nom du service</label>
                        <input type="text" x-model="newScript.name" placeholder="Ex: Backend API" required>
                    </div>
                    <div class="form-group">
                        <label>Chemin de l'exécutable</label>
                        <div class="flex-row">
                            <input type="text" x-model="newScript.path" placeholder="C:\...\python.exe" required style="flex: 1;">
                            <button type="button" class="btn" @click="browseFile()">Parcourir</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Dossier de travail (optionnel)</label>
                        <div class="flex-row">
                            <input type="text" x-model="newScript.cwd" placeholder="Y:\MonProjet" style="flex: 1;">
                            <button type="button" class="btn" @click="browseFolder()">Dossier</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Arguments (optionnel)</label>
                        <div class="flex-row">
                            <input type="text" x-model="newScript.args" placeholder="main.py --port 8080" style="flex: 1;">
                            <button type="button" class="btn" @click="browseArgsFile()">Fichier</button>
                        </div>
                    </div>
                    <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" id="autoStartCheck" x-model="newScript.auto_start" style="width: auto;">
                        <label for="autoStartCheck" style="margin: 0; cursor: pointer;">Lancer automatiquement au démarrage</label>
                    </div>
                    <div class="form-group">
                        <label>Lien vers GitHub (optionnel)</label>
                        <input type="url" x-model="newScript.github_url" placeholder="https://github.com/..." style="width: 100%;">
                    </div>
                    <div class="form-group">
                        <label>Lien vers Page Web (optionnel)</label>
                        <input type="url" x-model="newScript.web_url" placeholder="https://votre-site.com" style="width: 100%;">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" @click="showAddModal = false">Annuler</button>
                <button type="submit" form="addScriptForm" class="btn btn-primary" x-text="isEditing ? 'Enregistrer' : 'Ajouter le service'"></button>
            </div>
        </div>
    </div>

    <!-- ─── Terminal Modal ─── -->
    <div class="modal-overlay" x-show="showLogModal" style="display: none;">
        <div class="modal terminal-modal" @click.outside="closeLogModal()" x-show="showLogModal">
            <div class="modal-header terminal-header">
                <h2 style="display:flex; align-items:center; gap:8px;">
                    <span class="status-dot" :class="wsConnected ? 'active' : ''" :title="wsConnected ? 'Connecté' : 'Déconnecté'"></span>
                    <span x-text="'Terminal : ' + currentLogScript?.name"></span>
                </h2>
                <button class="icon-btn" @click="closeLogModal()">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M18 6 6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="modal-body terminal-body" x-ref="terminalOutput">
                <template x-for="(log, index) in logs" :key="index">
                    <div class="log-line" :class="log.startsWith('[ERROR]') ? 'log-error' : 'log-info'" x-text="log"></div>
                </template>
                <div x-show="logs.length === 0" style="color: #666; font-style: italic;">En attente de la sortie standard...</div>
            </div>
        </div>
    </div>

    <script src="/static/app.js?v=6"></script>
</body>
</html>
